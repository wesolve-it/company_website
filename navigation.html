<div
  x-data="{ open: false, isScrolled: false }"
  x-init="window.addEventListener('scroll', () => { isScrolled = window.scrollY > 10 })"
  x-effect="document.body.classList.toggle('overflow-hidden', open)"
  @keydown.escape.window="open = false"
  @click.away="open = false"
  :class="{ 'nav-dark': document.body.dataset.hero === 'dark' && !isScrolled && !open }"
  class="fixed top-0 z-50 w-full"
>
  <!-- Hintergrund & Blur bewusst NICHT am Wurzelelement: backdrop-filter macht das
       Element zum Anker für fixed-Kinder und würde das Mobile-Overlay auf Leistenhöhe einfangen -->
  <div
    :class="isScrolled ? 'bg-white/90 shadow-sm backdrop-blur-md dark:bg-wesolve-green-950/90' : 'bg-transparent'"
    class="transition-all duration-300 ease-in-out"
  >
    <div
      :class="isScrolled ? 'py-3' : 'py-5'"
      class="container mx-auto flex max-w-screen-xl items-center justify-between px-4 transition-all duration-300 ease-in-out"
    >
      <!-- Logo -->
      <a href="/" onclick="navigateTo(event, '/')" class="focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-wesolve-accent-400">
        <img width="625" height="84" src="/assets/img/wesolve_green.svg" alt="wesolve-IT" class="nav-logo h-8 w-auto dark:brightness-0 dark:invert">
      </a>

      <!-- Navigation Links + Theme Toggle -->
      <div class="flex items-center gap-4">
        <nav class="hidden items-center gap-8 text-[15px] font-semibold md:flex">
          <a href="/" class="nav-link nav-underline text-neutral-900 transition-colors duration-200 hover:text-wesolve-green-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-wesolve-green-500 dark:text-neutral-100">Home</a>
          <a href="/referenzen" class="nav-link nav-underline text-neutral-900 transition-colors duration-200 hover:text-wesolve-green-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-wesolve-green-500 dark:text-neutral-100">Referenzen</a>
          <a href="/leistungen" class="nav-link nav-underline text-neutral-900 transition-colors duration-200 hover:text-wesolve-green-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-wesolve-green-500 dark:text-neutral-100">Leistungen</a>
          <a href="/ueber-uns" class="nav-link nav-underline text-neutral-900 transition-colors duration-200 hover:text-wesolve-green-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-wesolve-green-500 dark:text-neutral-100">Über uns</a>
          <a data-umami-event="nav-kontakt" href="/kontakt" class="nav-cta rounded-lg bg-wesolve-green-700 px-5 py-2.5 text-white transition-colors duration-200 hover:bg-wesolve-green-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-wesolve-green-500 dark:bg-wesolve-green-200 dark:text-wesolve-green-950 dark:hover:bg-wesolve-green-100">Kontakt</a>
        </nav>
        <button
          @click="window.toggleTheme()"
          aria-label="Farbschema umschalten"
          class="nav-toggle mr-12 flex h-10 w-10 items-center justify-center rounded-lg border border-neutral-200 text-neutral-900 transition-colors duration-200 hover:border-wesolve-green-500 dark:border-neutral-700 dark:text-white dark:hover:border-wesolve-green-300 md:mr-0"
        >
          <svg class="h-5 w-5 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
          <svg class="hidden h-5 w-5 dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Hamburger Button -->
  <button
    @click="open = !open"
    :aria-expanded="open.toString()"
    aria-controls="mobile-menu"
    aria-label="Menü umschalten"
    class="fixed right-4 top-4 z-50 flex h-8 w-8 flex-col items-center justify-center md:hidden"
  >
    <span
      class="nav-burger block h-0.5 w-6 bg-neutral-900 dark:bg-white transition-transform duration-300 ease-in-out"
      :class="open ? 'rotate-45 translate-y-1.5' : ''"
    ></span>
    <span
      class="nav-burger my-1 block h-0.5 w-6 bg-neutral-900 dark:bg-white transition-all duration-300 ease-in-out"
      :class="open ? 'opacity-0' : ''"
    ></span>
    <span
      class="nav-burger block h-0.5 w-6 bg-neutral-900 dark:bg-white transition-transform duration-300 ease-in-out"
      :class="open ? '-rotate-45 -translate-y-1.5' : ''"
    ></span>
  </button>

  <!-- Mobile Overlay Menu -->
  <div
    class="pointer-events-none fixed inset-0 z-40 md:hidden"
    aria-hidden="true"
  >
    <!-- Semi-transparent background -->
    <div
      x-show="open"
      x-transition.opacity
      class="pointer-events-auto absolute inset-0 bg-neutral-900/40 backdrop-blur-sm"
      @click="open = false"
    ></div>

    <!-- Slide-in Panel -->
    <div
      id="mobile-menu"
      role="dialog"
      aria-modal="true"
      tabindex="-1"
      x-show="open"
      x-transition:enter="transform transition ease-out duration-300"
      x-transition:enter-start="translate-x-full"
      x-transition:enter-end="translate-x-0"
      x-transition:leave="transform transition ease-in duration-200"
      x-transition:leave-start="translate-x-0"
      x-transition:leave-end="translate-x-full"
      class="pointer-events-auto absolute right-0 top-0 flex h-full w-4/5 max-w-sm flex-col overflow-hidden border-l border-wesolve-green-200 bg-white p-6 shadow-xl dark:border-wesolve-green-800 dark:bg-wesolve-green-950"
    >
      <nav class="mt-20 flex flex-col items-end gap-6 text-2xl font-bold">
        <a href="/" class="group flex items-center gap-3 text-neutral-900 dark:text-neutral-100">
          <span class="h-1.5 w-1.5 bg-wesolve-accent-400 opacity-0 transition-opacity duration-300 group-hover:opacity-100"></span>Home
        </a>
        <a href="/referenzen" class="group flex items-center gap-3 text-neutral-900 dark:text-neutral-100">
          <span class="h-1.5 w-1.5 bg-wesolve-accent-400 opacity-0 transition-opacity duration-300 group-hover:opacity-100"></span>Referenzen
        </a>
        <a href="/leistungen" class="group flex items-center gap-3 text-neutral-900 dark:text-neutral-100">
          <span class="h-1.5 w-1.5 bg-wesolve-accent-400 opacity-0 transition-opacity duration-300 group-hover:opacity-100"></span>Leistungen
        </a>
        <a href="/ueber-uns" class="group flex items-center gap-3 text-neutral-900 dark:text-neutral-100">
          <span class="h-1.5 w-1.5 bg-wesolve-accent-400 opacity-0 transition-opacity duration-300 group-hover:opacity-100"></span>Über uns
        </a>
        <a data-umami-event="nav-kontakt" href="/kontakt" class="group flex items-center gap-3 text-neutral-900 dark:text-neutral-100">
          <span class="h-1.5 w-1.5 bg-wesolve-accent-400 opacity-0 transition-opacity duration-300 group-hover:opacity-100"></span>Kontakt
        </a>
      </nav>
      <a data-umami-event="nav-kontakt" href="/kontakt" class="mt-auto inline-flex items-center justify-center rounded-lg bg-wesolve-green-700 px-6 py-3.5 text-lg font-semibold text-white dark:bg-wesolve-green-200 dark:text-wesolve-green-950">
        Erstgespräch vereinbaren
      </a>
    </div>
  </div>
</div>
